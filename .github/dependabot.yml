version: 2
updates:
  - package-ecosystem: pip
    directory: /agentguard-testbed
    schedule:
      interval: weekly
    groups:
      python-minor:
        update-types: [minor, patch]
  - package-ecosystem: cargo
    directory: /agentguard-testbed/signer
    schedule:
      interval: weekly
    groups:
      rust-minor:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /agentguard-testbed/web
    schedule:
      interval: weekly
    groups:
      console-minor:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /agentguard-testbed
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
