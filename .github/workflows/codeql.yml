name: CodeQL

on:
  push:
    branches: [main, "feature/**"]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "29 2 * * 4"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CODEQL_ENABLED: ${{ github.event.repository.private == false || vars.CODEQL_ENABLED == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Explain unavailable private-repository analysis
        if: env.CODEQL_ENABLED != 'true'
        run: >-
          echo "CodeQL upload requires GitHub Code Security for private repositories;
          set the CODEQL_ENABLED repository variable only after that feature is enabled."
      - uses: github/codeql-action/init@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        if: env.CODEQL_ENABLED == 'true'
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        if: env.CODEQL_ENABLED == 'true'
        with:
          category: "/language:${{ matrix.language }}"
