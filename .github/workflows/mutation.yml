name: Mutation testing

on:
  schedule:
    - cron: "11 1 * * 6"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: agentguard-testbed

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  signer-authorization-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.29"
          python-version: "3.13"
          enable-cache: true
          working-directory: agentguard-testbed
      - run: uv sync --all-extras --frozen
      - name: Mutate the signer authorization gate
        run: uv run --with mutmut==3.6.0 mutmut run "aegisledger.signing*"
      - name: Export mutation statistics
        run: uv run --with mutmut==3.6.0 mutmut export-cicd-stats
      - name: Enforce signer mutation score
        run: >-
          uv run python scripts/check_mutation_score.py
          mutants/mutmut-cicd-stats.json
          --minimum-score 95
      - name: Preserve mutation report
        if: always()
        run: uv run --with mutmut==3.6.0 mutmut results > mutation-results.txt
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signer-authorization-mutation-results
          path: |
            agentguard-testbed/mutation-results.txt
            agentguard-testbed/mutants/mutmut-cicd-stats.json
          if-no-files-found: ignore
          retention-days: 30
