[graph]
targets = [
  { triple = "x86_64-unknown-linux-gnu" },
  { triple = "aarch64-unknown-linux-gnu" },
]
all-features = true

[advisories]
ignore = [
  { id = "RUSTSEC-2024-0436", reason = "Transitive Alloy macro dependency; advisory reports unmaintained status, no vulnerability, and no safe upgrade." },
  { id = "RUSTSEC-2025-0134", reason = "Transitive Tonic PEM parser; advisory reports unmaintained status, no vulnerability, and no safe upgrade." },
]

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
