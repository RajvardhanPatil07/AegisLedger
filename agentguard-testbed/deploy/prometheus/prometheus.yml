global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: aegisledger-api
    metrics_path: /metrics/
    static_configs:
      - targets: ["api:8000"]
  - job_name: keycloak
    metrics_path: /metrics
    static_configs:
      - targets: ["keycloak:9000"]
