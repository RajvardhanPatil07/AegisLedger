[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "aegisledger"
version = "0.2.0"
description = "Local-first authorization, settlement, and evaluation platform for agent-controlled wallets"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = [
  "alembic>=1.13,<2",
  "cryptography>=42,<46",
  "eth-hash[pycryptodome]>=0.7,<1",
  "fastapi>=0.109,<1",
  "grpcio>=1.65,<2",
  "httpx>=0.27,<1",
  "opentelemetry-api>=1.25,<2",
  "opentelemetry-sdk>=1.25,<2",
  "prometheus-client>=0.20,<1",
  "psycopg[binary]>=3.1,<4",
  "pydantic>=2.6,<3",
  "pydantic-settings>=2.2,<3",
  "PyJWT[crypto]>=2.8,<3",
  "PyYAML>=6,<7",
  "rfc8785>=0.1.4,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.27,<1",
]

[project.optional-dependencies]
dev = [
  "bandit[toml]>=1.7,<2",
  "hypothesis>=6.100,<7",
  "mypy>=1.10,<2",
  "pip-audit>=2.7,<3",
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<1",
  "ruff>=0.5,<1",
]

[project.scripts]
aegisledger = "aegisledger.cli:main"
aegisledger-evaluate = "agentwallet.eval.harness:main"
aegisledger-experiment = "aegisledger.evaluation:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aegisledger", "src/agentwallet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"
markers = [
  "anvil: starts a local Anvil process and exercises deployed contracts",
]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.9"
strict = true
packages = ["aegisledger"]

[tool.bandit]
exclude_dirs = ["tests"]
