[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "aegisledger"
version = "0.3.0"
description = "Local-first authorization, settlement, and evaluation platform for agent-controlled wallets"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "alembic>=1.13,<2",
  "cryptography>=48.0.1,<50",
  "eth-hash[pycryptodome]>=0.7,<1",
  "fastapi>=0.109,<1",
  "grpcio>=1.65,<2",
  "httpx>=0.27,<1",
  "opentelemetry-api>=1.25,<2",
  "opentelemetry-exporter-otlp-proto-grpc>=1.25,<2",
  "opentelemetry-instrumentation-fastapi>=0.46b0,<1",
  "opentelemetry-sdk>=1.25,<2",
  "prometheus-client>=0.20,<1",
  "protobuf>=5,<8",
  "psycopg[binary]>=3.1,<4",
  "pydantic>=2.6,<3",
  "pydantic-settings>=2.2,<3",
  "PyJWT[crypto]>=2.8,<3",
  "PyYAML>=6,<7",
  "rfc8785>=0.1.4,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.27,<1",
]

[project.optional-dependencies]
aws = [
  "boto3>=1.34,<2",
]
dev = [
  "bandit[toml]>=1.7,<2",
  "hypothesis>=6.100,<7",
  "mypy>=1.10,<2",
  "pip-audit>=2.7,<3",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.4,<2",
  "pytest-cov>=7,<8",
  "ruff>=0.5,<1",
  "types-PyYAML>=6,<7",
]

[project.scripts]
aegisledger = "aegisledger.cli:main"
aegisledger-evaluate = "agentwallet.eval.harness:main"
aegisledger-experiment = "aegisledger.evaluation:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aegisledger", "src/agentwallet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-config --strict-markers"
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]
markers = [
  "anvil: starts a local Anvil process and exercises deployed contracts",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["B008", "S101"]

[tool.ruff.lint.per-file-ignores]
# These legacy simulator fields represent asset symbols, not credentials.
"src/agentwallet/**/*.py" = ["S105", "S106", "S107"]

[tool.mypy]
python_version = "3.11"
packages = ["aegisledger", "agentwallet"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[tool.bandit]
exclude_dirs = ["tests"]

[tool.mutmut]
source_paths = ["src"]
pytest_add_cli_args_test_selection = ["tests/test_signer_authorization.py"]
# Error text is not authorization behavior; the preceding branch condition is still mutated.
do_not_mutate_patterns = ["raise SignerAuthorizationError"]
