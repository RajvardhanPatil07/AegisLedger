[package]
name = "aegisledger-signer"
version = "0.3.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[dependencies]
alloy-consensus = { version = "2.2", default-features = false, features = ["k256"] }
alloy-eips = { version = "2.2", default-features = false }
alloy-primitives = { version = "1.6", default-features = false, features = ["k256"] }
alloy-rlp = { version = "0.3.14", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
ed25519-dalek = "2"
hex = "0.4"
k256 = { version = "0.13", features = ["ecdsa"] }
prost = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_jcs = "0.1"
sha2 = "0.10"
sha3 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync"] }
tonic = { version = "0.12", features = ["tls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[build-dependencies]
protoc-bin-vendored = "3"
tonic-build = "0.14"
